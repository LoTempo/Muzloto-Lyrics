<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e8edf5">
    <title>Караоке-плеер</title>
    <style>
        @font-face {
            font-family: "Montserrat";
            src: url("Montserrat-VariableFont_wght.woff2") format("woff2"),
                 url("Montserrat-VariableFont_wght.ttf") format("truetype");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        :root {
            color-scheme: light;
            --accent: #ea580c;
            --accent-soft: #fff1e8;
            --ink: #101827;
            --muted: #667085;
            --surface: rgba(255, 255, 255, 0.94);
            --border: rgba(148, 163, 184, 0.28);
            --shadow: 0 18px 45px -24px rgba(15, 23, 42, 0.42);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 22px clamp(12px, 2.5vw, 36px) 40px;
            background:
                radial-gradient(circle at 12% 6%, rgba(249, 115, 22, 0.12), transparent 26rem),
                linear-gradient(145deg, #f1f5f9 0%, #dbe4f0 100%);
            color: var(--ink);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button:focus-visible,
        input:focus-visible,
        .lyric-line:focus-visible {
            outline: 3px solid rgba(234, 88, 12, 0.32);
            outline-offset: 3px;
        }

        .karaoke-container {
            width: min(100%, 1360px);
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-left: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #334155;
            font-family: "Montserrat", sans-serif;
            font-size: clamp(0.92rem, 1.5vw, 1.05rem);
            font-weight: 760;
            letter-spacing: -0.02em;
        }

        .brand-mark {
            display: grid;
            width: 36px;
            height: 36px;
            place-items: center;
            border-radius: 12px;
            background: var(--ink);
            color: white;
            box-shadow: 0 8px 20px -12px rgba(15, 23, 42, 0.9);
        }

        .language-switcher {
            display: inline-flex;
            padding: 3px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 8px 22px -18px rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        .language-button {
            min-width: 48px;
            border: 0;
            border-radius: 999px;
            padding: 7px 11px;
            background: transparent;
            color: #64748b;
            font-size: 0.78rem;
            font-weight: 750;
            cursor: pointer;
            transition: background-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
        }

        .language-button:hover {
            color: var(--ink);
        }

        .language-button.active {
            background: var(--ink);
            color: white;
            box-shadow: 0 5px 14px -8px rgba(15, 23, 42, 0.8);
        }

        .capture-toggle {
            display: inline-flex;
            min-height: 38px;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.78);
            color: #475569;
            font-size: 0.75rem;
            font-weight: 650;
            cursor: pointer;
            user-select: none;
            backdrop-filter: blur(10px);
        }

        .capture-toggle input {
            width: 16px;
            height: 16px;
            accent-color: #e11d48;
            cursor: pointer;
        }

        .upload-panel,
        .player-wrapper,
        .lyrics-wrapper {
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .upload-panel {
            margin-bottom: 14px;
            padding: 14px clamp(14px, 2vw, 24px);
            border-radius: 22px;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr) auto;
            align-items: end;
            gap: 14px;
        }

        .upload-item {
            min-width: 0;
        }

        .upload-item label {
            display: block;
            margin-bottom: 6px;
            color: #27364b;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .file-trigger {
            display: flex;
            width: 100%;
            min-height: 39px;
            align-items: center;
            justify-content: center;
            padding: 7px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #f8fafc;
            color: #3f4d61;
            font-size: 0.75rem;
            font-weight: 650;
            cursor: pointer;
            transition: border-color 160ms ease, background-color 160ms ease;
        }

        .file-trigger:hover {
            border-color: #fb923c;
            background: #fffaf7;
        }

        .file-input:focus-visible + .file-trigger {
            outline: 3px solid rgba(234, 88, 12, 0.32);
            outline-offset: 3px;
        }

        .info-badge {
            display: flex;
            min-height: 16px;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
            overflow: hidden;
            color: #64748b;
            font-size: 0.7rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .info-hint {
            font-size: 0.66rem;
        }

        .reset-btn {
            min-height: 39px;
            padding: 8px 18px;
            border: 0;
            border-radius: 12px;
            background: #334155;
            color: white;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 160ms ease, transform 160ms ease;
        }

        .reset-btn:hover {
            background: var(--accent);
        }

        .reset-btn:active {
            transform: scale(0.97);
        }

        .player-wrapper {
            margin-bottom: 14px;
            padding: 15px clamp(16px, 2.5vw, 30px);
            border-radius: 24px;
        }

        .player-heading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            color: var(--ink);
            font-family: "Montserrat", sans-serif;
            font-size: clamp(1.22rem, 2.3vw, 1.55rem);
            font-weight: 760;
        }

        .song-title {
            max-width: min(52vw, 620px);
            padding: 5px 13px;
            overflow: hidden;
            border-radius: 999px;
            background: #f1f5f9;
            color: var(--accent);
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        audio {
            display: block;
            width: 100%;
            height: 46px;
            border-radius: 999px;
            outline: none;
        }

        .lyrics-wrapper {
            position: relative;
            left: 50%;
            display: flex;
            width: 1520px;
            min-width: 1520px;
            height: clamp(460px, 72vh, 840px);
            min-height: 0;
            flex-direction: column;
            overflow: hidden;
            border-radius: 30px;
            transform: translateX(-50%);
        }

        .lyrics-display {
            flex: 1;
            min-height: 0;
            padding-inline: 30px;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            scroll-behavior: auto;
            scrollbar-width: none;
            text-align: center;
            touch-action: pan-y;
        }

        .lyrics-display::-webkit-scrollbar {
            display: none;
        }

.capture-guide {
    position: absolute;
    z-index: 5;

    width: 1505px;
    height: 206px;

    left: 50%;
    top: calc(50% - 2px);

    border: 3px dashed #e11d48;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

        .capture-guide[hidden] {
            display: none;
        }

        .lyrics-top-spacer,
        .lyrics-bottom-spacer {
            width: 100%;
            min-height: 0;
            pointer-events: none;
        }

        .lyric-line {
            --line-font-size: 30px;
            --active-font-size: var(--line-font-size);
            position: relative;
            z-index: 0;
            display: flex;
            width: calc(100% - 52px);
            height: var(--line-reserved-height, auto);
            max-width: none;
            margin: 0 auto;
            align-items: center;
            justify-content: center;
            padding: 13px 12px;
            border-radius: 16px;
            color: #8a94a5;
            font-family: "Montserrat", sans-serif;
            font-size: var(--line-font-size);
            font-weight: 500;
            line-height: 1;
            opacity: 0.62;
            cursor: pointer;
            transition:
                color 360ms cubic-bezier(0.4, 0, 0.2, 1),
                opacity 360ms cubic-bezier(0.4, 0, 0.2, 1),
                font-size 420ms cubic-bezier(0.4, 0, 0.2, 1),
                font-weight 420ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lyric-line.multiline {
            padding-block: 9px;
        }

        .lyric-text {
            max-width: 100%;
            white-space: nowrap;
        }

        .lyric-line:hover {
            color: #566174;
            opacity: 0.82;
        }

        .lyric-line.active {
            z-index: 1;
            color: #05070b;
            font-size: var(--active-font-size);
            font-weight: 800;
            opacity: 1;
        }

        .empty-state {
            display: grid;
            height: 100%;
            padding: 28px;
            place-items: center;
            color: #8491a5;
            font-size: clamp(0.98rem, 2vw, 1.12rem);
            line-height: 1.65;
            text-align: center;
        }

        .empty-state strong {
            display: block;
            margin-bottom: 4px;
            color: #526076;
            font-size: 1.08em;
        }

        @media (max-width: 800px) {
            body {
                padding-top: 14px;
            }

            .upload-grid {
                grid-template-columns: 1fr 1fr;
            }

            .upload-item:last-child {
                grid-column: 1 / -1;
            }

            .reset-btn {
                width: 100%;
            }

        }

        @media (max-width: 560px) {
            .topbar {
                margin-bottom: 10px;
            }

            .topbar-actions {
                width: 100%;
                justify-content: space-between;
                margin-left: 0;
            }

            .capture-toggle {
                min-height: 34px;
                padding: 6px 10px;
            }

            .brand-mark {
                width: 32px;
                height: 32px;
                border-radius: 10px;
            }

            .language-button {
                min-width: 43px;
                padding: 6px 9px;
            }

            .upload-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .upload-item:last-child {
                grid-column: auto;
            }

            .player-heading {
                align-items: stretch;
                flex-direction: column;
                gap: 7px;
                text-align: center;
            }

            .song-title {
                max-width: 100%;
                align-self: center;
            }

        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
<main class="karaoke-container">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">♪</span>
            <span data-i18n="brand">Караоке-плеер</span>
        </div>
        <div class="topbar-actions">
            <label class="capture-toggle" for="captureGuideToggle">
                <input type="checkbox" id="captureGuideToggle" aria-controls="captureGuide" checked>
                <span data-i18n="showCaptureGuide">Показывать область захвата</span>
            </label>
            <div class="language-switcher" role="group" data-i18n-aria="languageSelector">
                <button class="language-button" type="button" data-language="ru" aria-pressed="true">RU</button>
                <button class="language-button" type="button" data-language="en" aria-pressed="false">EN</button>
            </div>
        </div>
    </header>

    <section class="upload-panel" data-i18n-aria="uploadPanel">
        <div class="upload-grid">
            <div class="upload-item">
                <label for="audioFileInput" data-i18n="audioLabel">🎵 Аудио (MP3, M4A и другие)</label>
                <input type="file" id="audioFileInput" accept="audio/*" class="file-input">
                <label class="file-trigger" for="audioFileInput" data-i18n="chooseAudio">Выбрать аудиофайл</label>
                <div class="info-badge" id="audioFileName" aria-live="polite"></div>
            </div>
            <div class="upload-item">
                <label for="lyricsFileInput" data-i18n="lyricsLabel">📄 Текст песни (TXT или LRC)</label>
                <input type="file" id="lyricsFileInput" accept=".txt,.lrc,text/plain" class="file-input">
                <label class="file-trigger" for="lyricsFileInput" data-i18n="chooseLyrics">Выбрать текст песни</label>
                <div class="info-badge" id="lyricsFileName" aria-live="polite"></div>
                <div class="info-badge info-hint" data-i18n="txtHint">✨ Для TXT временные метки создаются автоматически</div>
            </div>
            <div class="upload-item">
                <button id="resetFilesBtn" class="reset-btn" type="button" data-i18n="reset">Сбросить всё</button>
            </div>
        </div>
    </section>

    <section class="player-wrapper" data-i18n-aria="playerPanel">
        <h1 class="player-heading">
            <span data-i18n="karaoke">Караоке</span>
            <span id="trackNameDisplay" class="song-title">—</span>
        </h1>
        <audio id="audio" controls preload="metadata">
            <span data-i18n="audioUnsupported">Ваш браузер не поддерживает аудио.</span>
        </audio>
    </section>

    <section class="lyrics-wrapper" data-i18n-aria="lyricsPanel">
        <div class="lyrics-display" id="lyrics" aria-live="polite"></div>
        <div class="capture-guide" id="captureGuide" aria-hidden="true"></div>
    </section>
</main>

<script>
    const translations = {
        ru: {
            pageTitle: "Караоке-плеер",
            brand: "Караоке-плеер",
            languageSelector: "Выбор языка",
            showCaptureGuide: "Показывать область захвата",
            uploadPanel: "Загрузка файлов",
            playerPanel: "Аудиоплеер",
            lyricsPanel: "Текст песни",
            audioLabel: "🎵 Аудио (MP3, M4A и другие)",
            lyricsLabel: "📄 Текст песни (TXT или LRC)",
            chooseAudio: "Выбрать аудиофайл",
            chooseLyrics: "Выбрать текст песни",
            txtHint: "✨ Для TXT временные метки создаются автоматически",
            reset: "Сбросить всё",
            karaoke: "Караоке",
            audioUnsupported: "Ваш браузер не поддерживает аудио.",
            noFile: "Файл не выбран",
            selected: "Выбран: {name}",
            fileError: "Ошибка чтения файла",
            audioError: "Не удалось открыть аудиофайл",
            emptyTitle: "Загрузите аудио и текст песни",
            emptyHint: "TXT будет синхронизирован автоматически, а LRC сохранит свои временные метки.",
            noLyricsTitle: "В файле нет строк песни",
            noLyricsHint: "Выберите корректный TXT- или LRC-файл.",
            lyricsErrorTitle: "Не удалось обработать файл",
            lyricsErrorHint: "Проверьте формат и попробуйте загрузить текст снова."
        },
        en: {
            pageTitle: "Karaoke Player",
            brand: "Karaoke Player",
            languageSelector: "Language selector",
            showCaptureGuide: "Show capture area",
            uploadPanel: "File upload",
            playerPanel: "Audio player",
            lyricsPanel: "Song lyrics",
            audioLabel: "🎵 Audio (MP3, M4A, and more)",
            lyricsLabel: "📄 Lyrics (TXT or LRC)",
            chooseAudio: "Choose audio file",
            chooseLyrics: "Choose lyrics file",
            txtHint: "✨ Timing is generated automatically for TXT files",
            reset: "Reset all",
            karaoke: "Karaoke",
            audioUnsupported: "Your browser does not support audio.",
            noFile: "No file selected",
            selected: "Selected: {name}",
            fileError: "Could not read the file",
            audioError: "Could not open the audio file",
            emptyTitle: "Upload audio and song lyrics",
            emptyHint: "TXT will be timed automatically, while LRC keeps its original timestamps.",
            noLyricsTitle: "No lyric lines found",
            noLyricsHint: "Choose a valid TXT or LRC file.",
            lyricsErrorTitle: "Could not process the file",
            lyricsErrorHint: "Check the format and try uploading the lyrics again."
        }
    };

    let currentLanguage = "ru";

    function translate(key, values = {}) {
        const template = translations[currentLanguage][key] || translations.ru[key] || key;
        return Object.entries(values).reduce(
            (result, [name, value]) => result.replaceAll(`{${name}}`, value),
            template
        );
    }

    function setLanguage(language, persist = true) {
        currentLanguage = translations[language] ? language : "ru";
        document.documentElement.lang = currentLanguage;
        document.title = translate("pageTitle");

        document.querySelectorAll("[data-i18n]").forEach((element) => {
            element.textContent = translate(element.dataset.i18n);
        });

        document.querySelectorAll("[data-i18n-aria]").forEach((element) => {
            element.setAttribute("aria-label", translate(element.dataset.i18nAria));
        });

        document.querySelectorAll("[data-language]").forEach((button) => {
            const isActive = button.dataset.language === currentLanguage;
            button.classList.toggle("active", isActive);
            button.setAttribute("aria-pressed", String(isActive));
        });

        if (persist) {
            try {
                localStorage.setItem("karaoke-language", currentLanguage);
            } catch (_) {
                // Language selection still works when storage is unavailable.
            }
        }

        window.karaokeApp?.handleLanguageChange();
    }

    class SmoothKaraokePlayer {
        constructor() {
            this.audio = document.getElementById("audio");
            this.lyricsContainer = document.getElementById("lyrics");
            this.audioFileInput = document.getElementById("audioFileInput");
            this.lyricsFileInput = document.getElementById("lyricsFileInput");
            this.resetBtn = document.getElementById("resetFilesBtn");
            this.audioFileNameSpan = document.getElementById("audioFileName");
            this.lyricsFileNameSpan = document.getElementById("lyricsFileName");
            this.trackNameDisplay = document.getElementById("trackNameDisplay");
            this.captureGuideToggle = document.getElementById("captureGuideToggle");
            this.captureGuide = document.getElementById("captureGuide");

            this.lyrics = [];
            this.currentLineIndex = -1;
            this.currentAudioUrl = null;
            this.audioFile = null;
            this.lyricsFile = null;
            this.audioLoadError = false;
            this.plainTextSource = null;
            this.currentMessageKey = "empty";
            this.updateRaf = null;
            this.layoutRaf = null;
            this.activeScrollAnimation = null;
            this.resizeObserver = null;
            this.topSpacer = null;
            this.bottomSpacer = null;
            this.measureCanvas = document.createElement("canvas");

            this.initEventListeners();
            this.restoreCaptureGuidePreference();
            this.updateFileLabels();
            this.renderMessage("empty");

            if (document.fonts?.ready) {
                document.fonts.ready.then(() => this.scheduleLayoutUpdate());
            }
        }

        initEventListeners() {
            document.querySelectorAll("[data-language]").forEach((button) => {
                button.addEventListener("click", () => setLanguage(button.dataset.language));
            });

            this.audioFileInput.addEventListener("change", (event) => {
                const file = event.target.files[0];
                if (file) this.loadAudioFile(file);
            });

            this.lyricsFileInput.addEventListener("change", (event) => {
                const file = event.target.files[0];
                if (file) this.loadLyricsFile(file);
            });

            this.resetBtn.addEventListener("click", () => this.resetAll());

            this.captureGuideToggle.addEventListener("change", () => {
                this.setCaptureGuideVisibility(this.captureGuideToggle.checked, true);
            });

            this.audio.addEventListener("timeupdate", () => this.scheduleDisplayUpdate());
            this.audio.addEventListener("seeked", () => this.scheduleDisplayUpdate());
            this.audio.addEventListener("play", () => this.scheduleDisplayUpdate());
            this.audio.addEventListener("loadedmetadata", () => this.handleAudioMetadata());
            this.audio.addEventListener("error", () => {
                if (!this.currentAudioUrl) return;
                this.audioLoadError = true;
                this.updateFileLabels();
            });

            this.lyricsContainer.addEventListener("click", (event) => {
                const line = event.target.closest(".lyric-line");
                if (line) this.seekToLine(line);
            });

            this.lyricsContainer.addEventListener("keydown", (event) => {
                if (event.key !== "Enter" && event.key !== " ") return;
                const line = event.target.closest(".lyric-line");
                if (!line) return;
                event.preventDefault();
                this.seekToLine(line);
            });

            this.resizeObserver = new ResizeObserver(() => this.scheduleLayoutUpdate());
            this.resizeObserver.observe(this.lyricsContainer);

            window.addEventListener("beforeunload", () => this.releaseAudioUrl());
        }

        handleLanguageChange() {
            this.updateFileLabels();
            if (this.currentMessageKey) this.renderMessage(this.currentMessageKey);
        }

        restoreCaptureGuidePreference() {
            let isVisible = true;
            try {
                const savedValue = localStorage.getItem("karaoke-capture-guide-visible");
                if (savedValue !== null) isVisible = savedValue === "true";
            } catch (_) {
                // Keep the guide visible when storage is unavailable.
            }
            this.setCaptureGuideVisibility(isVisible, false);
        }

        setCaptureGuideVisibility(isVisible, persist) {
            this.captureGuideToggle.checked = isVisible;
            this.captureGuide.hidden = !isVisible;

            if (persist) {
                try {
                    localStorage.setItem("karaoke-capture-guide-visible", String(isVisible));
                } catch (_) {
                    // The toggle still works when storage is unavailable.
                }
            }
        }

        updateFileLabels() {
            this.audioFileNameSpan.textContent = this.audioLoadError
                ? `⚠ ${translate("audioError")}`
                : this.audioFile
                    ? `✓ ${translate("selected", { name: this.shortenFileName(this.audioFile.name) })}`
                    : translate("noFile");
            this.lyricsFileNameSpan.textContent = this.lyricsFile
                ? `✓ ${translate("selected", { name: this.shortenFileName(this.lyricsFile.name) })}`
                : translate("noFile");
        }

        shortenFileName(name, maxLength = 42) {
            if (name.length <= maxLength) return name;
            const extensionIndex = name.lastIndexOf(".");
            const extension = extensionIndex > 0 ? name.slice(extensionIndex) : "";
            const available = Math.max(12, maxLength - extension.length - 1);
            return `${name.slice(0, available)}…${extension}`;
        }

        releaseAudioUrl() {
            if (!this.currentAudioUrl) return;
            URL.revokeObjectURL(this.currentAudioUrl);
            this.currentAudioUrl = null;
        }

        loadAudioFile(file) {
            this.releaseAudioUrl();
            this.audioFile = file;
            this.audioLoadError = false;
            this.currentAudioUrl = URL.createObjectURL(file);
            this.audio.src = this.currentAudioUrl;
            this.audio.load();
            this.trackNameDisplay.textContent = file.name.replace(/\.[^/.]+$/, "");
            this.updateFileLabels();
            this.scheduleDisplayUpdate();
        }

        handleAudioMetadata() {
            if (this.plainTextSource !== null) {
                this.convertTxtToTimedLyrics(this.plainTextSource);
                this.renderLyrics();
            }
            this.scheduleDisplayUpdate();
        }

        async loadLyricsFile(file) {
            this.lyricsFile = file;
            this.updateFileLabels();

            try {
                const text = await file.text();
                const isLrc = /\[\d{1,3}:\d{2}(?:[.:]\d{1,3})?\]/.test(text)
                    || file.name.toLowerCase().endsWith(".lrc");

                if (isLrc) {
                    this.plainTextSource = null;
                    this.parseLRC(text);
                } else {
                    this.plainTextSource = text;
                    this.convertTxtToTimedLyrics(text);
                }

                if (!this.lyrics.length) {
                    this.renderMessage("noLyrics");
                    return;
                }

                this.renderLyrics();
            } catch (error) {
                console.error(error);
                this.lyrics = [];
                this.lyricsFile = null;
                this.lyricsFileInput.value = "";
                this.lyricsFileNameSpan.textContent = `⚠ ${translate("fileError")}`;
                this.renderMessage("lyricsError");
            }
        }

        getPlainTextLines(rawText) {
            return rawText
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter((line) => line.length > 0
                    && !line.startsWith("[")
                    && !line.startsWith("#")
                    && !line.startsWith(";"));
        }

        convertTxtToTimedLyrics(rawText) {
            const textLines = this.getPlainTextLines(rawText);
            if (!textLines.length) {
                this.lyrics = [];
                return;
            }

            const duration = Number.isFinite(this.audio.duration) && this.audio.duration > 0
                ? this.audio.duration
                : null;

            if (duration) {
                const step = duration / textLines.length;
                this.lyrics = textLines.map((text, index) => ({
                    time: Math.min(index * step, Math.max(0, duration - 0.15)),
                    text
                }));
            } else {
                this.lyrics = textLines.map((text, index) => ({ time: index * 4, text }));
            }
        }

        parseLRC(lrcText) {
            const offsetMatch = lrcText.match(/^\[offset:([+-]?\d+)\]/im);
            const offsetSeconds = offsetMatch ? Number(offsetMatch[1]) / 1000 : 0;
            const timestampPattern = /\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
            const parsed = [];

            for (const line of lrcText.split(/\r?\n/)) {
                const timestamps = [...line.matchAll(timestampPattern)];
                if (!timestamps.length) continue;

                const text = line.replace(timestampPattern, "").trim();
                if (!text) continue;

                for (const match of timestamps) {
                    const minutes = Number(match[1]);
                    const seconds = Number(match[2]);
                    const fraction = match[3] ? Number(`0.${match[3]}`) : 0;
                    const time = Math.max(0, minutes * 60 + seconds + fraction + offsetSeconds);
                    parsed.push({ time, text });
                }
            }

            this.lyrics = parsed.sort((a, b) => a.time - b.time);

            if (!this.lyrics.length) {
                const plainLines = this.getPlainTextLines(lrcText);
                if (plainLines.length) {
                    this.plainTextSource = plainLines.join("\n");
                    this.convertTxtToTimedLyrics(this.plainTextSource);
                }
            }
        }

        renderLyrics() {
            if (!this.lyrics.length) {
                this.renderMessage("noLyrics");
                return;
            }

            this.cancelScrollAnimation();
            this.currentMessageKey = null;
            this.currentLineIndex = -1;
            this.lyricsContainer.innerHTML = `
                <div class="lyrics-top-spacer" aria-hidden="true"></div>
                ${this.lyrics.map((lyric, index) => `
                    <div class="lyric-line" data-index="${index}" role="button" tabindex="0">
                        <span class="lyric-text">${this.escapeHtml(lyric.text)}</span>
                    </div>
                `).join("")}
                <div class="lyrics-bottom-spacer" aria-hidden="true"></div>
            `;

            this.topSpacer = this.lyricsContainer.querySelector(".lyrics-top-spacer");
            this.bottomSpacer = this.lyricsContainer.querySelector(".lyrics-bottom-spacer");
            this.lyricsContainer.scrollTop = 0;
            this.scheduleLayoutUpdate();
            this.scheduleDisplayUpdate();
        }

        renderMessage(type) {
            const keys = {
                empty: ["emptyTitle", "emptyHint"],
                noLyrics: ["noLyricsTitle", "noLyricsHint"],
                lyricsError: ["lyricsErrorTitle", "lyricsErrorHint"]
            };
            const [titleKey, hintKey] = keys[type] || keys.empty;
            this.currentMessageKey = type;
            this.topSpacer = null;
            this.bottomSpacer = null;
            this.lyricsContainer.innerHTML = `
                <div class="empty-state">
                    <div><strong>${this.escapeHtml(translate(titleKey))}</strong>${this.escapeHtml(translate(hintKey))}</div>
                </div>
            `;
        }

        scheduleLayoutUpdate() {
            if (this.layoutRaf) cancelAnimationFrame(this.layoutRaf);
            this.layoutRaf = requestAnimationFrame(() => {
                this.layoutRaf = null;
                this.layoutLyricLines();
                this.updateSpacerHeights();

                if (this.currentLineIndex >= 0) {
                    const activeLine = this.getLineElements()[this.currentLineIndex];
                    if (activeLine) this.smoothScrollToElement(activeLine, 0);
                }
            });
        }

        layoutLyricLines() {
            const lines = this.getLineElements();
            if (!lines.length) return;

            const activeLines = Array.from(lines).filter((line) => line.classList.contains("active"));
            activeLines.forEach((line) => line.classList.remove("active"));
            lines.forEach((line) => {
                line.style.removeProperty("--line-font-size");
                line.style.removeProperty("--active-font-size");
                line.style.removeProperty("--line-reserved-height");
            });
            const baseFontSize = parseFloat(getComputedStyle(lines[0]).fontSize);
            const context = this.measureCanvas.getContext("2d");
            if (!context || !baseFontSize) return;

            for (const line of lines) {
                const index = Number(line.dataset.index);
                const text = this.lyrics[index]?.text || "";
                const textElement = line.querySelector(".lyric-text");
                if (!textElement) continue;

                const availableWidth = Math.max(1, line.clientWidth - 24);
                const desiredActiveSize = baseFontSize * 1.08;
                context.font = `800 ${desiredActiveSize}px Montserrat, sans-serif`;
                const stableLines = this.wrapTextForWidth(text, context, availableWidth);

                line.classList.toggle("multiline", stableLines.length > 1);
                const styles = getComputedStyle(line);
                const lineHeightRatio = parseFloat(styles.lineHeight) / parseFloat(styles.fontSize) || 1.22;
                const verticalPadding = parseFloat(styles.paddingTop) + parseFloat(styles.paddingBottom);
                const reservedHeight = Math.ceil(
                    desiredActiveSize * lineHeightRatio * stableLines.length + verticalPadding
                );

                textElement.innerHTML = stableLines.map((part) => this.escapeHtml(part)).join("<br>");
                line.style.setProperty("--line-font-size", `${baseFontSize}px`);
                line.style.setProperty("--active-font-size", `${desiredActiveSize}px`);
                line.style.setProperty("--line-reserved-height", `${reservedHeight}px`);
            }
            activeLines.forEach((line) => line.classList.add("active"));
        }

        wrapTextForWidth(text, context, maxWidth) {
            const words = text.trim().split(/\s+/).filter(Boolean);
            const wrappedLines = [];
            let currentLine = "";

            for (const word of words) {
                const candidate = currentLine ? `${currentLine} ${word}` : word;
                if (context.measureText(candidate).width <= maxWidth) {
                    currentLine = candidate;
                    continue;
                }

                if (currentLine) {
                    wrappedLines.push(currentLine);
                    currentLine = "";
                }

                if (context.measureText(word).width <= maxWidth) {
                    currentLine = word;
                    continue;
                }

                let chunk = "";
                for (const character of Array.from(word)) {
                    if (chunk && context.measureText(chunk + character).width > maxWidth) {
                        wrappedLines.push(chunk);
                        chunk = character;
                    } else {
                        chunk += character;
                    }
                }
                currentLine = chunk;
            }

            if (currentLine) wrappedLines.push(currentLine);
            return wrappedLines.length ? wrappedLines : [text];
        }

        updateSpacerHeights() {
            const lines = this.getLineElements();
            if (!this.topSpacer || !this.bottomSpacer || !lines.length) return;

            const containerHeight = this.lyricsContainer.clientHeight;
            const topHeight = Math.max(0, (containerHeight - lines[0].offsetHeight) / 2);
            const bottomHeight = Math.max(0, (containerHeight - lines[lines.length - 1].offsetHeight) / 2);
            this.topSpacer.style.height = `${topHeight}px`;
            this.bottomSpacer.style.height = `${bottomHeight}px`;
        }

        getLineElements() {
            return this.lyricsContainer.querySelectorAll(".lyric-line");
        }

        seekToLine(line) {
            if (!this.audioFile) return;
            const index = Number(line.dataset.index);
            if (!Number.isInteger(index) || !this.lyrics[index]) return;
            this.audio.currentTime = this.lyrics[index].time;
            this.scheduleDisplayUpdate();
        }

        scheduleDisplayUpdate() {
            if (this.updateRaf) return;
            this.updateRaf = requestAnimationFrame(() => {
                this.updateRaf = null;
                this.updateDisplay();
            });
        }

        findActiveLineIndex(currentTime) {
            let low = 0;
            let high = this.lyrics.length - 1;
            let result = -1;

            while (low <= high) {
                const middle = Math.floor((low + high) / 2);
                if (this.lyrics[middle].time <= currentTime) {
                    result = middle;
                    low = middle + 1;
                } else {
                    high = middle - 1;
                }
            }
            return result;
        }

        updateDisplay() {
            if (!this.lyrics.length) return;
            const activeIndex = this.findActiveLineIndex(this.audio.currentTime);
            if (activeIndex === this.currentLineIndex) return;

            const lines = this.getLineElements();
            const previousLine = lines[this.currentLineIndex];
            const activeLine = lines[activeIndex];
            previousLine?.classList.remove("active");
            activeLine?.classList.add("active");
            this.currentLineIndex = activeIndex;

            if (activeLine) {
                requestAnimationFrame(() => this.smoothScrollToElement(activeLine, 500));
            } else {
                this.cancelScrollAnimation();
                this.lyricsContainer.scrollTop = 0;
            }
        }

        cancelScrollAnimation() {
            if (!this.activeScrollAnimation) return;
            cancelAnimationFrame(this.activeScrollAnimation);
            this.activeScrollAnimation = null;
        }

        smoothScrollToElement(element, duration = 480) {
            if (!element) return;
            const container = this.lyricsContainer;
            this.cancelScrollAnimation();

            const target = Math.max(0, Math.min(
                element.offsetTop - container.clientHeight / 2 + element.offsetHeight / 2,
                container.scrollHeight - container.clientHeight
            ));

            const start = container.scrollTop;
            const distance = target - start;
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            if (duration <= 0 || reduceMotion || Math.abs(distance) < 1) {
                container.scrollTop = target;
                return;
            }

            const startTime = performance.now();
            const easeInOutCubic = (value) => value < 0.5
                ? 4 * value * value * value
                : 1 - Math.pow(-2 * value + 2, 3) / 2;

            const animate = (time) => {
                const progress = Math.min(1, (time - startTime) / duration);
                container.scrollTop = start + distance * easeInOutCubic(progress);

                if (progress < 1) {
                    this.activeScrollAnimation = requestAnimationFrame(animate);
                } else {
                    this.activeScrollAnimation = null;
                }
            };

            this.activeScrollAnimation = requestAnimationFrame(animate);
        }

        resetAll() {
            this.cancelScrollAnimation();
            if (this.layoutRaf) cancelAnimationFrame(this.layoutRaf);
            if (this.updateRaf) cancelAnimationFrame(this.updateRaf);

            this.audio.pause();
            this.releaseAudioUrl();
            this.audio.removeAttribute("src");
            this.audio.load();
            this.audioFileInput.value = "";
            this.lyricsFileInput.value = "";
            this.trackNameDisplay.textContent = "—";
            this.audioFile = null;
            this.lyricsFile = null;
            this.audioLoadError = false;
            this.plainTextSource = null;
            this.lyrics = [];
            this.currentLineIndex = -1;
            this.updateRaf = null;
            this.layoutRaf = null;
            this.updateFileLabels();
            this.renderMessage("empty");
        }

        escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, (character) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;",
                "'": "&#039;"
            })[character]);
        }
    }

    window.addEventListener("DOMContentLoaded", () => {
        let savedLanguage = null;
        try {
            savedLanguage = localStorage.getItem("karaoke-language");
        } catch (_) {
            // Fall back to the browser language.
        }

        const initialLanguage = translations[savedLanguage]
            ? savedLanguage
            : (navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en";

        setLanguage(initialLanguage, false);
        window.karaokeApp = new SmoothKaraokePlayer();
    });
</script>
</body>
</html>
